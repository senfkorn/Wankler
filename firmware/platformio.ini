; PlatformIO Projektkonfiguration – Wankler Kompressionsmessgerät
; https://docs.platformio.org/page/projectconf.html
;
; Hinweis: Diese Datei war im Originalprojekt nicht enthalten und wurde anhand
; der in main.cpp verwendeten Bibliotheken und Zielhardware (Arduino Nano,
; ATmega328) rekonstruiert. Bitte bei Bedarf an die tatsächlich verwendeten
; Bibliotheksversionen anpassen.

[env:nanoatmega328]
platform = atmelavr
board = nanoatmega328
framework = arduino
monitor_speed = 115200

lib_deps =
    marcoschwartz/LiquidCrystal_I2C @ ^1.1.4
    mathertel/RotaryEncoder @ ^1.5.3
    mathertel/OneButton @ ^2.0.3
